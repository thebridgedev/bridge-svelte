name: "Sync Docs to GitLab (Bridge Web)"
description: "Syncs /learning folder to bridge-web GitLab repo using a sync-docs branch."
runs:
  using: "composite"

  steps:
    - name: 🧾 Checkout repository
      uses: actions/checkout@v4

    - name: 🔐 Setup SSH for GitLab
      shell: bash
      run: |
        set -e
        
        # Create SSH directory with proper permissions
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        # Debug: Check if the secret is set
        if [ -z "$DOCS_SYNC_KEY" ]; then
          echo "❌ DOCS_SYNC_KEY secret is not set"
          exit 1
        fi
        
        # Write SSH key with proper formatting and validation
        echo "🔍 Writing SSH key..."
        echo "$DOCS_SYNC_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        # Validate SSH key format
        echo "🔍 Validating SSH key format..."
        if ! ssh-keygen -l -f ~/.ssh/id_rsa >/dev/null 2>&1; then
          echo "❌ Invalid SSH key format detected"
          echo "🔍 First few characters of key:"
          head -c 50 ~/.ssh/id_rsa
          echo ""
          echo "🔍 Last few characters of key:"
          tail -c 50 ~/.ssh/id_rsa
          exit 1
        fi
        
        # Add GitLab to known hosts
        echo "🔍 Adding GitLab to known hosts..."
        ssh-keyscan -H gitlab.com >> ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts
        
        # Try SSH agent approach first
        echo "🔍 Starting SSH agent..."
        eval "$(ssh-agent -s)"
        
        echo "🔍 Adding SSH key to agent..."
        if ssh-add ~/.ssh/id_rsa; then
          echo "✅ SSH key added to agent successfully"
        else
          echo "⚠️ Failed to add SSH key to agent, trying direct key approach..."
          # Set SSH config to use the key directly
          echo "Host gitlab.com" > ~/.ssh/config
          echo "    HostName gitlab.com" >> ~/.ssh/config
          echo "    User git" >> ~/.ssh/config
          echo "    IdentityFile ~/.ssh/id_rsa" >> ~/.ssh/config
          echo "    IdentitiesOnly yes" >> ~/.ssh/config
          echo "    StrictHostKeyChecking no" >> ~/.ssh/config
          chmod 600 ~/.ssh/config
        fi
        
        # Test SSH connection
        echo "🔍 Testing SSH connection to GitLab..."
        ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no -T git@gitlab.com || echo "⚠️ SSH test completed (expected for GitLab)"
        
        echo "✅ SSH setup completed"

    - name: 🧠 Sync /learning folder to Bridge Web (sync-docs branch)
      shell: bash
      run: |
        set -e

        REPO_NAME=$(basename "${{ github.repository }}")
        GITLAB_REPO="git@gitlab.com:nebulrgroup/bridge/bridge-web.git"
        SYNC_BRANCH="sync-docs/$REPO_NAME"

        echo "🔄 Syncing /learning content from $REPO_NAME → $GITLAB_REPO ($SYNC_BRANCH)"
        
        # Verify SSH key is loaded
        echo "🔍 Verifying SSH key is loaded..."
        ssh-add -l || echo "⚠️ No SSH keys loaded in agent"
        
        # Test GitLab connectivity before cloning
        echo "🔍 Testing GitLab connectivity..."
        ssh -o ConnectTimeout=10 -T git@gitlab.com || echo "⚠️ SSH test completed (expected for GitLab)"

        echo "📥 Cloning repository..."
        git clone "$GITLAB_REPO"
        cd bridge-web

        git config user.name "Docs Sync Bot"
        git config user.email "docs.bot@nebulr.group"

        TARGET_PATH="bridge-docs/synced/$REPO_NAME"
        mkdir -p "$TARGET_PATH"

        # Remove old synced content for this plugin
        rm -rf "$TARGET_PATH"/* || true

        # Copy new content (excluding README.md)
        rsync -av --exclude='README.md' ../learning/ "$TARGET_PATH"/ || true

        # Stage all changes including deletions
        git add -A .

        if git diff --cached --quiet; then
          echo "✅ No new documentation changes to sync."
          exit 0
        fi

        git commit -m "Sync learning docs from $REPO_NAME@${{ github.sha }}" || true

        echo "🧩 Preparing sync branch $SYNC_BRANCH..."
        git checkout -B $SYNC_BRANCH

        # This branch is a mirror, not a history. Every run rebuilds it from a
        # fresh clone of bridge-web with the whole of /learning copied in, so
        # the commit in hand is already complete and current.
        #
        # Reconciling it with the previous run's tip can therefore only bring
        # older content back, and did: a rebase conflict fell through to a merge
        # that kept the stale side of every file it did not consider conflicting,
        # so a published docs correction was quietly undone. Overwrite instead.
        echo "🚀 Force-updating GitLab branch $SYNC_BRANCH..."
        PREVIOUS=$(git ls-remote origin "refs/heads/$SYNC_BRANCH" | cut -f1)
        if [ -n "$PREVIOUS" ]; then
          # Refuse, loudly, if something moved the branch after we read it,
          # rather than trampling a run we cannot see.
          git push --force-with-lease="$SYNC_BRANCH:$PREVIOUS" origin HEAD:$SYNC_BRANCH
        else
          git push origin HEAD:$SYNC_BRANCH
        fi

        echo "✅ Sync complete for $REPO_NAME → $GITLAB_REPO@$SYNC_BRANCH"

